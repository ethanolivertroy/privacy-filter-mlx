[project]
name = "opf-mlx"
version = "0.1.0"
description = "Standalone MLX implementation of OpenAI Privacy Filter for local inference on Apple Silicon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mlx>=0.32",
  "numpy>=2",
  "tiktoken>=0.12",
]

[project.scripts]
opf-mlx = "opf_mlx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
