<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="616" viewBox="0 0 1040 616" role="img" aria-labelledby="t d">
  <title id="t">Privacy screen for Pi: what it covers, and what gets past it</title>
  <desc id="d">Three ways data can leave your Mac. One is screened: requests Pi sends to a model provider pass through the privacy screen and leave masked—except for values missed by the detector, images, values that are encoded, hashed, or split across lines, names appearing only in the system prompt, and text added by another extension afterwards. Two paths are not screened at all: local tools run with real values and send whatever they send (for example via curl, git push, uploads, or web fetches), and other extensions can make their own direct model calls.</desc>
  <defs>
    <marker id="ah-local" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" class="ah-local"/>
    </marker>
    <marker id="ah-cloud" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" class="ah-cloud"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" class="ah-red"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .bg { fill: #ffffff; stroke: #d1d9e0; }
      .title { font-size: 20px; font-weight: 600; }
      .leg { font-size: 12.5px; fill: #59636e; }
      .zone { font-size: 11.5px; font-weight: 600; fill: #59636e; letter-spacing: 0.09em; }
      .zone-rect { fill: none; stroke: #afb8c1; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .pi { fill: #f6f8fa; stroke: #818b98; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
      .ours { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.8; }
      .cloud { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.8; }
      .out { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.8; }
      .warn { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
      .warn-line { stroke: #cf222e; stroke-width: 1.5; fill: none; }
      .warn-t { font-size: 12.5px; font-weight: 600; fill: #a40e26; }
      .warn-s { font-size: 12px; fill: #1f2328; }
      .box-t { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .box-s { font-size: 12px; fill: #454c54; text-anchor: middle; }
      .dim { fill: #59636e; }
      .e-local { stroke: #0969da; stroke-width: 1.8; fill: none; marker-end: url(#ah-local); }
      .e-cloud { stroke: #bc4c00; stroke-width: 2.6; fill: none; marker-end: url(#ah-cloud); }
      .e-red { stroke: #cf222e; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#ah-red); }
      .ah-local { fill: #0969da; }
      .ah-cloud { fill: #bc4c00; }
      .ah-red { fill: #cf222e; }
      .lbl { font-size: 13px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .sub { font-size: 12.5px; }
      .mid { text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e6edf3; }
        .bg { fill: #0d1117; stroke: #30363d; }
        .leg, .zone { fill: #9198a1; }
        .zone-rect { stroke: #484f58; }
        .pi { fill: #161b22; stroke: #6e7681; }
        .chip { fill: #0d1117; stroke: #30363d; }
        .ours { fill: #12261e; stroke: #3fb950; }
        .cloud { fill: #272115; stroke: #d29922; }
        .out { fill: #2a1416; stroke: #f85149; }
        .warn { fill: #2a1416; stroke: #f85149; }
        .warn-line { stroke: #f85149; }
        .warn-t { fill: #ff7b72; }
        .warn-s { fill: #e6edf3; }
        .box-s { fill: #b1bac4; }
        .dim { fill: #9198a1; }
        .e-local { stroke: #58a6ff; }
        .e-cloud { stroke: #f0883e; }
        .e-red { stroke: #f85149; }
        .ah-local { fill: #58a6ff; }
        .ah-cloud { fill: #f0883e; }
        .ah-red { fill: #f85149; }
        .lbl { stroke: #0d1117; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="615" rx="10" class="bg"/>

  <!-- heading and legend -->
  <text x="24" y="38" class="title">Privacy screen for Pi: what it covers, and what gets past it</text>
  <line x1="672" y1="29" x2="700" y2="29" class="e-cloud"/>
  <text x="715" y="34" class="leg">leaves masked</text>
  <line x1="826" y1="29" x2="868" y2="29" class="e-red"/>
  <text x="883" y="34" class="leg">leaves unscreened</text>

  <!-- where things run -->
  <rect x="20" y="58" width="640" height="494" rx="14" class="zone-rect"/>
  <text x="38" y="82" class="zone">ON THIS MAC</text>
  <rect x="710" y="58" width="310" height="494" rx="14" class="zone-rect"/>
  <text x="728" y="82" class="zone">OUTSIDE</text>

  <!-- arrows (drawn first, so boxes and labels sit on top) -->
  <line x1="210" y1="142" x2="294" y2="142" class="e-local"/>
  <line x1="500" y1="142" x2="732" y2="142" class="e-cloud"/>
  <line x1="400" y1="180" x2="400" y2="212" class="warn-line"/>
  <line x1="210" y1="382" x2="732" y2="382" class="e-red"/>
  <line x1="210" y1="490" x2="732" y2="490" class="e-red"/>

  <!-- the screened way out -->
  <rect x="40" y="104" width="170" height="324" rx="10" class="pi"/>
  <text x="125" y="134" class="box-t">Pi agent</text>
  <text x="125" y="154" class="box-s">works on real text</text>
  <rect x="56" y="236" width="138" height="30" rx="6" class="chip"/>
  <text x="125" y="256" class="box-s">session file</text>
  <rect x="56" y="367" width="138" height="30" rx="6" class="chip"/>
  <text x="125" y="387" class="box-s">tools: edit, bash</text>

  <rect x="300" y="104" width="200" height="76" rx="10" class="ours"/>
  <text x="400" y="136" class="box-t">Privacy screen</text>
  <text x="400" y="157" class="box-s">masks what it finds</text>

  <rect x="740" y="104" width="250" height="76" rx="10" class="cloud"/>
  <text x="865" y="136" class="box-t">Model provider</text>
  <text x="865" y="157" class="box-s">gets placeholders</text>

  <text x="252" y="126" class="lbl mid">requests</text>
  <text x="606" y="126" class="lbl mid">masked</text>

  <!-- what the screen itself lets through -->
  <rect x="250" y="212" width="350" height="122" rx="10" class="warn"/>
  <text x="268" y="236" class="warn-t">Goes through the screen unmasked</text>
  <text x="268" y="258" class="warn-s">values missed by the detector, and images</text>
  <text x="268" y="277" class="warn-s">values that are encoded, hashed, or split across lines</text>
  <text x="268" y="296" class="warn-s">names that appear only in the system prompt</text>
  <text x="268" y="315" class="warn-s">text added by another extension afterwards</text>

  <!-- tools -->
  <rect x="740" y="344" width="250" height="76" rx="10" class="out"/>
  <text x="865" y="376" class="box-t">Tool destinations</text>
  <text x="865" y="397" class="box-s">curl, git push, uploads, web fetches</text>
  <text x="435" y="365" class="lbl mid">tools run with real values</text>
  <text x="435" y="403" class="lbl mid sub dim">the screen does not inspect what tools do</text>

  <!-- other extensions -->
  <rect x="40" y="452" width="170" height="76" rx="10" class="pi"/>
  <text x="125" y="484" class="box-t">Other extensions</text>
  <text x="125" y="505" class="box-s">their own code</text>
  <rect x="740" y="452" width="250" height="76" rx="10" class="out"/>
  <text x="865" y="484" class="box-t">External APIs</text>
  <text x="865" y="505" class="box-s">any model or endpoint</text>
  <text x="435" y="473" class="lbl mid">direct model calls from other extensions</text>
  <text x="435" y="511" class="lbl mid sub dim">these bypass Pi's agent loop</text>

  <text x="24" y="578" class="leg">Note: local models are not screened unless configured. The session file stores the real conversation and placeholder table.</text>
  <text x="24" y="596" class="leg">Detection relies on a model and pattern rules. It reduces what leaves your Mac—it is not a guarantee.</text>
</svg>
