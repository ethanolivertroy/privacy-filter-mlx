<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730" role="img" aria-labelledby="t d">
  <title id="t">Privacy screen for Pi: how a request is screened</title>
  <desc id="d">Pi works on real text locally. Each outgoing request passes through the extension, which queries the local detector opf-mlx serve for private spans, replaces each found value with a numbered placeholder, saves the mapping in a table, and sends the masked request to the model provider. When the reply returns with placeholders, the extension restores the real values in the reply text and tool arguments before Pi stores, displays, or runs them. The session file, placeholder table, and detector all stay on your Mac. If the detector cannot be reached, nothing is sent.</desc>
  <defs>
    <marker id="ah-local" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" class="ah-local"/>
    </marker>
    <marker id="ah-cloud" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" class="ah-cloud"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .bg { fill: #ffffff; stroke: #d1d9e0; }
      .title { font-size: 20px; font-weight: 600; }
      .leg { font-size: 12.5px; fill: #59636e; }
      .zone { font-size: 11.5px; font-weight: 600; fill: #59636e; letter-spacing: 0.09em; }
      .zone-rect { fill: none; stroke: #afb8c1; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .ext { fill: #1a7f37; fill-opacity: 0.04; stroke: #1a7f37; stroke-opacity: 0.6; stroke-width: 1.2; stroke-dasharray: 4 5; }
      .ext-t { fill: #1a7f37; }
      .pi { fill: #f6f8fa; stroke: #818b98; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
      .ours { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.8; }
      .cloud { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.8; }
      .box-t { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .box-s { font-size: 12px; fill: #454c54; text-anchor: middle; }
      .dim { fill: #59636e; }
      .e-local { stroke: #0969da; stroke-width: 1.8; fill: none; marker-end: url(#ah-local); }
      .e-cloud { stroke: #bc4c00; stroke-width: 2.6; fill: none; marker-end: url(#ah-cloud); }
      .ah-local { fill: #0969da; }
      .ah-cloud { fill: #bc4c00; }
      .b-local { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
      .b-cloud { fill: #ffffff; stroke: #bc4c00; stroke-width: 1.5; }
      .num { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .n-local { fill: #0969da; }
      .n-cloud { fill: #bc4c00; }
      .lbl { font-size: 13px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .small { font-size: 11.5px; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e6edf3; }
        .bg { fill: #0d1117; stroke: #30363d; }
        .leg, .zone { fill: #9198a1; }
        .zone-rect { stroke: #484f58; }
        .ext { fill: #3fb950; stroke: #3fb950; }
        .ext-t { fill: #3fb950; }
        .pi { fill: #161b22; stroke: #6e7681; }
        .chip { fill: #0d1117; stroke: #30363d; }
        .ours { fill: #12261e; stroke: #3fb950; }
        .cloud { fill: #272115; stroke: #d29922; }
        .box-s { fill: #b1bac4; }
        .dim { fill: #9198a1; }
        .e-local { stroke: #58a6ff; }
        .e-cloud { stroke: #f0883e; }
        .ah-local { fill: #58a6ff; }
        .ah-cloud { fill: #f0883e; }
        .b-local { fill: #0d1117; stroke: #58a6ff; }
        .b-cloud { fill: #0d1117; stroke: #f0883e; }
        .n-local { fill: #58a6ff; }
        .n-cloud { fill: #f0883e; }
        .lbl { stroke: #0d1117; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="729" rx="10" class="bg"/>

  <!-- heading and legend -->
  <text x="24" y="38" class="title">Privacy screen for Pi: how a request is screened</text>
  <rect x="640" y="22" width="14" height="14" rx="3" class="ours"/>
  <text x="661" y="34" class="leg">this project</text>
  <rect x="752" y="22" width="14" height="14" rx="3" class="pi"/>
  <text x="773" y="34" class="leg">Pi</text>
  <line x1="812" y1="29" x2="836" y2="29" class="e-cloud"/>
  <text x="851" y="34" class="leg">leaves this Mac</text>

  <!-- where things run -->
  <rect x="20" y="58" width="780" height="652" rx="14" class="zone-rect"/>
  <text x="38" y="82" class="zone">ON THIS MAC</text>
  <rect x="850" y="58" width="170" height="652" rx="14" class="zone-rect"/>
  <text x="868" y="82" class="zone">OUTSIDE</text>
  <rect x="326" y="216" width="278" height="444" rx="12" class="ext"/>
  <text x="340" y="237" class="zone ext-t">PI EXTENSION</text>

  <!-- arrows (drawn first, so boxes and labels sit on top) -->
  <line x1="210" y1="293" x2="344" y2="293" class="e-local"/>
  <line x1="495" y1="250" x2="495" y2="182" class="e-local"/>
  <line x1="547" y1="176" x2="547" y2="244" class="e-local"/>
  <line x1="465" y1="336" x2="465" y2="394" class="e-local"/>
  <line x1="580" y1="293" x2="858" y2="293" class="e-cloud"/>
  <line x1="866" y1="593" x2="588" y2="593" class="e-cloud"/>
  <line x1="465" y1="486" x2="465" y2="544" class="e-local"/>
  <line x1="350" y1="593" x2="216" y2="593" class="e-local"/>

  <!-- boxes -->
  <rect x="350" y="98" width="230" height="78" rx="10" class="ours"/>
  <text x="465" y="127" class="box-t mono">opf-mlx serve</text>
  <text x="465" y="147" class="box-s">Local Privacy Filter model</text>
  <text x="465" y="164" class="box-s small dim">Unix socket only (no network)</text>

  <rect x="40" y="250" width="170" height="386" rx="10" class="pi"/>
  <text x="125" y="284" class="box-t">Pi agent</text>
  <text x="125" y="304" class="box-s">works on real text</text>
  <rect x="56" y="398" width="138" height="30" rx="6" class="chip"/>
  <text x="125" y="418" class="box-s">session file</text>
  <rect x="56" y="438" width="138" height="30" rx="6" class="chip"/>
  <text x="125" y="458" class="box-s">your terminal</text>
  <rect x="56" y="478" width="138" height="30" rx="6" class="chip"/>
  <text x="125" y="498" class="box-s">tools: edit, bash</text>

  <rect x="350" y="250" width="230" height="86" rx="10" class="ours"/>
  <text x="465" y="279" class="box-t">Mask outgoing</text>
  <text x="465" y="299" class="box-s">detector + key patterns + .env</text>
  <text x="465" y="318" class="box-s small dim mono">context_with_system</text>

  <rect x="350" y="400" width="230" height="86" rx="10" class="ours"/>
  <text x="465" y="429" class="box-t">Placeholder table</text>
  <text x="465" y="449" class="box-s small mono">&lt;SECRET_1&gt; = ghp_x7Kq…</text>
  <text x="465" y="468" class="box-s small dim">saved with the session</text>

  <rect x="350" y="550" width="230" height="86" rx="10" class="ours"/>
  <text x="465" y="579" class="box-t">Restore values</text>
  <text x="465" y="599" class="box-s">reply text, tool arguments</text>
  <text x="465" y="618" class="box-s small dim mono">message_end, tool_call</text>

  <rect x="866" y="250" width="138" height="386" rx="10" class="cloud"/>
  <text x="935" y="436" class="box-t">Model provider</text>
  <text x="935" y="457" class="box-s">remote API</text>
  <text x="935" y="476" class="box-s small dim">sees placeholders</text>

  <!-- step numbers on the arrows -->
  <circle cx="268" cy="293" r="9.5" class="b-local"/><text x="268" y="297" class="num n-local">1</text>
  <circle cx="495" cy="198" r="9.5" class="b-local"/><text x="495" y="202" class="num n-local">2</text>
  <circle cx="547" cy="198" r="9.5" class="b-local"/><text x="547" y="202" class="num n-local">3</text>
  <circle cx="465" cy="365" r="9.5" class="b-local"/><text x="465" y="369" class="num n-local">4</text>
  <circle cx="702" cy="293" r="9.5" class="b-cloud"/><text x="702" y="297" class="num n-cloud">5</text>
  <circle cx="702" cy="593" r="9.5" class="b-cloud"/><text x="702" y="597" class="num n-cloud">6</text>
  <circle cx="465" cy="515" r="9.5" class="b-local"/><text x="465" y="519" class="num n-local">7</text>
  <circle cx="268" cy="593" r="9.5" class="b-local"/><text x="268" y="597" class="num n-local">8</text>

  <!-- what moves along each arrow -->
  <text x="268" y="275" class="lbl mid">each request</text>
  <text x="268" y="316" class="lbl mid small dim">real text</text>
  <text x="479" y="202" class="lbl end">new texts</text>
  <text x="563" y="202" class="lbl">spans</text>
  <text x="482" y="369" class="lbl">new pairs</text>
  <text x="702" y="275" class="lbl mid">masked request</text>
  <text x="702" y="316" class="lbl mid mono small dim">GITHUB_TOKEN=&lt;SECRET_1&gt;</text>
  <text x="702" y="575" class="lbl mid">reply with placeholders</text>
  <text x="702" y="616" class="lbl mid mono small dim">echo &lt;SECRET_1&gt; &gt; .token</text>
  <text x="482" y="519" class="lbl">values</text>
  <text x="268" y="575" class="lbl mid">real values</text>
  <text x="268" y="616" class="lbl mid small dim">stored, shown, run</text>

  <text x="38" y="684" class="leg">The session file, placeholder table, and detector stay on your Mac. The model provider receives only the masked request.</text>
  <text x="38" y="701" class="leg">If the detector cannot be reached, nothing is sent.</text>
</svg>
